# Before We Start: Setup

**Step 1.** Build the database (once, in your terminal):

```bash
cd ~/Desktop/sandbox/courses/sql-industry-prep
Rscript data/setup.R
```

This creates `data/uber.sqlite` with 6 tables (~39K rides, 800 drivers, 4K riders).

--

**Step 2.** Install **DB Browser for SQLite** — a free GUI app:

Download from [sqlitebrowser.org/dl](https://sqlitebrowser.org/dl/), drag to Applications, then:

```bash
open -a "DB Browser for SQLite" data/uber.sqlite
```

--

**Step 3.** Go to the **Execute SQL** tab. Type a query, hit `Cmd+Return` to run it.

**Important:** only highlight and run one `SELECT ... ;` at a time. Don't paste whole files — the `.headers on` lines at the top of exercise files are terminal-only commands and will cause errors in DB Browser.

---

# Why SQL? (You can do all of this in R)

Yes — but there are three reasons you'll use SQL anyway:

--

**1. Scale.** R loads everything into RAM. A 10GB dataset crashes your laptop. A SQL database handles it without blinking — the data stays on disk, and only the result comes back.

--

**2. The data already lives there.** At most tech companies, you don't get a CSV. You get access to a database with billions of rows. SQL is how you talk to it.

--

**3. It's the lingua franca.** Every data tool speaks SQL. Every data person knows SQL. When a PM asks "how many rides last week?", the answer starts with `SELECT COUNT(*)`.

---

# Why SQL? It's not about speed — it's about scale

For data that fits in your laptop's RAM, R/dplyr is actually **faster** than SQLite. That's fine.

The point is what happens when it **doesn't** fit:

| Dataset size | R (dplyr) | SQL database |
|---|---|---|
| 100K rows (~10 MB) | Fast | Fast |
| 10M rows (~1 GB) | Slow but works | Fast |
| 100M rows (~10 GB) | **Crashes** (out of RAM) | Fast |
| 1B+ rows (~100 GB) | Impossible | Still fast (Postgres, Spark) |

--

At a ride-sharing company, the `rides` table has **billions** of rows. You can't `read_csv` that. You write a SQL query, the database runs it on the server, and only the **result** (a few rows) comes back to your laptop.

--

That's why every data job requires SQL — not because it's faster for small data, but because it's the **only way to touch big data**.

---

# What This Course Is

A 5-module SQL refresher targeted at **applied economist / data science** interviews in tech.

--

**SQL** is the shared language for querying databases. There are several **engines** that run it:

| Engine | What it is | When you'd use it |
|---|---|---|
| **SQLite** | A single file on your laptop, zero setup | Tutorials, small projects, mobile apps |
| **PostgreSQL** | A full server, most feature-rich | Production analytics, data warehouses |
| **MySQL** | A full server, widely used in web apps | Web backends, some analytics |

~95% of the queries are identical across all three. We use **SQLite** because it's a single file with no server to manage. The patterns transfer directly — if your interviewer uses a different dialect, just ask about syntax differences (mostly date functions).

--

- **Database:** SQLite (`data/uber.sqlite`), built by `Rscript data/setup.R`
- **Schema:** rides, requests, drivers, riders, neighborhoods, cities
- **Format:** every module is concept → code → 3-6 interview-style questions
- **Goal:** be able to write the canonical analytical queries from a cold start

# The Schema

A **schema** is the map of a database: what tables exist, what columns each has, and how they link. If you're used to R or Stata, think of it as having **multiple data frames stored together** with columns that let you `left_join` between them.

```
cities         (city_id, name, country, lead_pm)
neighborhoods  (nbhd_id, city_id, name, pct_minority, median_income)
drivers        (driver_id, signup_date, gender, home_nbhd_id)
riders         (rider_id, signup_date, home_nbhd_id)
requests       (request_id, rider_id, pickup_nbhd_id, dropoff_nbhd_id,
                requested_at, accepted, accepted_by_driver_id)
rides          (ride_id, request_id, driver_id, started_at, ended_at,
                distance_mi, fare_usd, surge_mult, rider_rating)
```

--

The linking columns (e.g. `driver_id` appears in both `rides` and `drivers`) are what you'd use as the `by =` argument in dplyr. In SQL, you use `JOIN ... ON` instead.

---

# The Core Syntax

&lt;pre style="background:#f5f5f5;padding:0.9em 1em;border-radius:4px;font-family:'Source Code Pro',Menlo,monospace;line-height:1.55;font-size:90%;margin:0;"&gt;
&lt;span style="color:#6a3d9a;"&gt;&lt;b&gt;⑤ SELECT&lt;/b&gt; col1, col2, agg_func(col3) &lt;b&gt;AS&lt;/b&gt; result_name&lt;/span&gt;
&lt;span style="color:#1f78b4;"&gt;&lt;b&gt;① FROM&lt;/b&gt;   table_name&lt;/span&gt;
&lt;span style="color:#33a02c;"&gt;&lt;b&gt;② WHERE&lt;/b&gt;  some_condition&lt;/span&gt;
&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③ GROUP BY&lt;/b&gt; col1, col2&lt;/span&gt;
&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④ HAVING&lt;/b&gt; aggregate_condition&lt;/span&gt;
&lt;span style="color:#b15928;"&gt;&lt;b&gt;⑥ ORDER BY&lt;/b&gt; col1 DESC&lt;/span&gt;
&lt;span style="color:#555;"&gt;&lt;b&gt;⑦ LIMIT&lt;/b&gt; 10;&lt;/span&gt;
&lt;/pre&gt;

--

**Logical execution order** (different from written order — numbers ①–⑦ above match):

&lt;span style="color:#1f78b4;"&gt;&lt;b&gt;① FROM&lt;/b&gt;&lt;/span&gt; → &lt;span style="color:#33a02c;"&gt;&lt;b&gt;② WHERE&lt;/b&gt;&lt;/span&gt; → &lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③ GROUP BY&lt;/b&gt;&lt;/span&gt; → &lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④ HAVING&lt;/b&gt;&lt;/span&gt; → &lt;span style="color:#6a3d9a;"&gt;&lt;b&gt;⑤ SELECT&lt;/b&gt;&lt;/span&gt; → &lt;span style="color:#b15928;"&gt;&lt;b&gt;⑥ ORDER BY&lt;/b&gt;&lt;/span&gt; → &lt;span style="color:#555;"&gt;&lt;b&gt;⑦ LIMIT&lt;/b&gt;&lt;/span&gt;

--

A **column alias** is the name you give a computed result with `AS` — e.g., `fare_usd * 1.5 AS surge_fare`. It's like naming a new column in `mutate(surge_fare = fare_usd * 1.5)`.

This execution order matters: `WHERE` happens **before** SELECT, so you can't use an alias in `WHERE` (it doesn't exist yet). `ORDER BY` happens **after** SELECT, so you can.

---

# Five Things to Remember

**1. `COUNT(*)` vs `COUNT(col)`** — `COUNT(*)` counts rows; `COUNT(col)` skips NULLs in `col`.

--

**2. `COUNT(DISTINCT col)`** — the most common non-trivial aggregate.

--

**3. `AVG` and `SUM` ignore NULLs.** Usually what you want. If not, wrap in `COALESCE(col, 0)`.

--

**4. `WHERE` filters rows; `HAVING` filters groups.** No aggregates in `WHERE`.
&lt;span style="font-size:70%;"&gt;Order: &lt;span style="color:#1f78b4;"&gt;&lt;b&gt;①F&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#33a02c;"&gt;&lt;b&gt;②W&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③G&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④H&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#6a3d9a;"&gt;&lt;b&gt;⑤S&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#b15928;"&gt;&lt;b&gt;⑥O&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#555;"&gt;&lt;b&gt;⑦L&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;

--

**5. `LIMIT` is *not* a sample.** It's the first N rows after `ORDER BY`. Without sorting, the order is undefined.

---

# Date Handling in SQLite

```sql
date(col)                          -- '2025-01-15'
strftime('%Y-%m', col)             -- '2025-01'
strftime('%w', col)                -- day of week (0=Sun)
strftime('%H', col)                -- hour of day
date(col, 'start of month')        -- first of the month
date(col, '-7 days')               -- a week ago
julianday(b) - julianday(a)        -- day difference
```

--

In Postgres or MySQL the syntax is different (`DATE_TRUNC`, `EXTRACT`), but the patterns are the same. If your interviewer uses a different dialect, just ask.

---

# Pattern: Top-N


```sql
SELECT ride_id, driver_id, distance_mi, fare_usd
FROM   rides
ORDER BY distance_mi DESC
LIMIT 5;
```




Table: 5 records

| ride_id| driver_id| distance_mi| fare_usd|
|-------:|---------:|-----------:|--------:|
|   28699|       744|       36.82|    90.87|
|   11316|       157|       30.26|    73.29|
|   35411|       800|       29.30|    47.41|
|    5731|       468|       29.11|    45.44|
|     313|       532|       28.87|    65.01|

--

The two essentials: an `ORDER BY` and a `LIMIT`. Forget the `ORDER BY` and you'll get five arbitrary rows.

---

# Pattern: Filtered Aggregate


```sql
SELECT COUNT(*) AS rides_dec, AVG(fare_usd) AS avg_fare
FROM   rides
WHERE  date(started_at) BETWEEN '2025-12-01' AND '2025-12-31';
```




Table: 1 records

| rides_dec| avg_fare|
|---------:|--------:|
|      3292| 11.84374|

--

`WHERE` happens before aggregation, so this counts December rides and averages their fares.

---

# Pattern: Group By + Having

**Drivers with at least 50 rides in 2025**:


```sql
SELECT driver_id, COUNT(*) AS n_rides
FROM   rides
WHERE  date(started_at) BETWEEN '2025-01-01' AND '2025-12-31'
GROUP BY driver_id
HAVING COUNT(*) &gt;= 50
ORDER BY n_rides DESC
LIMIT 5;
```




Table: 5 records

| driver_id| n_rides|
|---------:|-------:|
|       188|      73|
|       333|      69|
|       626|      66|
|       239|      66|
|       353|      65|

--

**Don't put `COUNT(*) &gt;= 100` in `WHERE`** — aggregates don't exist there yet. `HAVING` is the post-aggregation filter.

---

# Pattern: Conditional Counts


```sql
SELECT
  COUNT(*) AS total,
  SUM(CASE WHEN accepted = 1 THEN 1 ELSE 0 END) AS accepted_count,
  ROUND(AVG(CASE WHEN accepted = 1 THEN 1.0 ELSE 0 END), 3) AS accept_rate
FROM requests;
```




Table: 1 records

| total| accepted_count| accept_rate|
|-----:|--------------:|-----------:|
| 50000|          39000|        0.78|

--

The `CASE WHEN ... THEN 1 ELSE 0 END` trick is the SQL version of `mean(x == "foo")` in R. **Memorize it** — you'll use it constantly.

---

# Common Mistakes

- **Integer division:** `SUM(x) / COUNT(*)` → 0 if both are integers and the result &lt; 1. Always cast: `1.0 * SUM(x) / COUNT(*)`

--

- **NULLs in `AVG`:** ignored, not zeroed. `AVG(fare_usd)` on 100 rows with 50 NULLs averages over the 50 non-NULL rows.

--

- **Column aliases in `WHERE`:** doesn't work. Repeat the expression or wrap in a subquery.
  &lt;span style="font-size:70%;"&gt;Order: &lt;span style="color:#1f78b4;"&gt;&lt;b&gt;①F&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#33a02c;"&gt;&lt;b&gt;②W&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③G&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④H&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#6a3d9a;"&gt;&lt;b&gt;⑤S&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#b15928;"&gt;&lt;b&gt;⑥O&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#555;"&gt;&lt;b&gt;⑦L&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;

--

- **`BETWEEN` is inclusive on both ends.** `WHERE x BETWEEN 1 AND 10` is `x &gt;= 1 AND x &lt;= 10`.

--

- **Case-sensitive string comparison.** Use `LOWER()` or `COLLATE NOCASE`.

# Q1. What is the average fare by hour of day?

--

&lt;a class="write-ref" href="../module-03/slides.html#write-order"&gt;WO&lt;/a&gt;
*Hint: you need `strftime('%H', ...)` to extract the hour, `AVG()`, and `GROUP BY`.*

ORDER BY hour

# Q3. How often does surge pricing kick in, and what's the average multiplier?

--

&lt;a class="write-ref" href="../module-03/slides.html#write-order"&gt;WO&lt;/a&gt;
*Hint: use the `CASE WHEN ... THEN 1 ELSE 0 END` trick inside `SUM()` and `AVG()`.*

--


```sql
SELECT
  COUNT(*) AS total_rides,
  SUM(CASE WHEN surge_mult &gt; 1.0 THEN 1 ELSE 0 END) AS surged_rides,
  ROUND(1.0 * SUM(CASE WHEN surge_mult &gt; 1.0 THEN 1 ELSE 0 END) / COUNT(*), 3)
    AS pct_surged,
  ROUND(AVG(surge_mult), 3) AS avg_surge_mult
FROM rides;
```

| total_rides| surged_rides| pct_surged| avg_surge_mult|
|-----------:|------------:|----------:|--------------:|
|       39000|        28949|      0.742|          1.246|

name: q4-city-surge

# Q4. Average fare by city, for surged rides only?

--

*Hint: `rides` has no `city_id` — chase foreign keys: `rides → requests →
neighborhoods → cities`. Filters on `surge_mult` are row-level, so `WHERE`
(this previews the [multi-table JOIN pattern from Module 2](../module-02/slides.html#multi-chain)).*

--

.small[
**1. Which tables?** `fare_usd`/`surge_mult` are in `rides`; city needs a chain.
```sql
FROM rides r
```
]

--

.small[
**2. Chain the joins to `cities`.**
```sql
JOIN requests req    ON r.request_id = req.request_id
JOIN neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
JOIN cities c        ON n.city_id = c.city_id
```
]

--

.small[
**3. Filter before aggregating, then group and sort.**
&lt;span style="font-size:87%;"&gt;Order: &lt;span style="color:#1f78b4;"&gt;&lt;b&gt;①F&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#33a02c;"&gt;&lt;b&gt;②W&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③G&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④H&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#6a3d9a;"&gt;&lt;b&gt;⑤S&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#b15928;"&gt;&lt;b&gt;⑥O&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#555;"&gt;&lt;b&gt;⑦L&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;
```sql
WHERE r.surge_mult &gt; 1
GROUP BY c.name
ORDER BY avg_fare DESC
```
]

# Q4. Average fare by city, for surged rides only? (cont.)

.small[

```sql
SELECT c.name AS city_name,
       ROUND(AVG(r.fare_usd), 2) AS avg_fare
FROM   rides r
JOIN   requests req    ON r.request_id = req.request_id
JOIN   neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
JOIN   cities c        ON n.city_id = c.city_id
WHERE  r.surge_mult &gt; 1
GROUP BY c.name
ORDER BY avg_fare DESC;
```

|city_name     | avg_fare|
|:-------------|--------:|
|Boston        |    12.71|
|San Francisco |    12.65|
|Chicago       |    12.63|
|Austin        |    12.63|
|Seattle       |    12.62|
]

name: q5-nbhd-revenue

# Q5. Top 3 pickup neighborhoods by total fare revenue?

--

*Hint: only count neighborhoods with at least 50 rides. That's a group-level
condition (it depends on each group's row count), so it's `HAVING`, not
`WHERE`. The join chain previews the [multi-table pattern from Module 2](../module-02/slides.html#multi-chain).*

--

.small[
**1. Which tables?** `fare_usd` is in `rides`; neighborhood name is in `neighborhoods`.
```sql
FROM rides r
```
]

--

.small[
**2. Chain the joins.**
```sql
JOIN requests req      ON r.request_id = req.request_id
JOIN neighborhoods nei ON req.pickup_nbhd_id = nei.nbhd_id
```
]

--

.small[
**3. Aggregate per neighborhood, filter on the aggregate, sort, cap.**
`WHERE` filters rows *before* grouping — no per-group count exists yet at
that point, so it can't reference one. `HAVING` runs *after* `GROUP BY`,
once each group's aggregate is already computed.
&lt;span style="font-size:87%;"&gt;Order: &lt;span style="color:#1f78b4;"&gt;&lt;b&gt;①F&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#33a02c;"&gt;&lt;b&gt;②W&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③G&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④H&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#6a3d9a;"&gt;&lt;b&gt;⑤S&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#b15928;"&gt;&lt;b&gt;⑥O&lt;/b&gt;&lt;/span&gt;→&lt;span style="color:#555;"&gt;&lt;b&gt;⑦L&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;
```sql
GROUP BY nei.name
HAVING COUNT(*) &gt;= 50
ORDER BY total_revenue DESC
LIMIT 3
```
]

# Q5. Top 3 pickup neighborhoods by total fare revenue? (cont.)

.small[

```sql
SELECT nei.name AS neighborhood_name,
       ROUND(SUM(r.fare_usd), 2) AS total_revenue,
       COUNT(*) AS n_rides
FROM   rides r
JOIN   requests req      ON r.request_id = req.request_id
JOIN   neighborhoods nei ON req.pickup_nbhd_id = nei.nbhd_id
GROUP BY nei.name
HAVING COUNT(*) &gt;= 50
ORDER BY total_revenue DESC
LIMIT 3;
```

# Q6. Rides and avg fare by day of week, Mon-Sun order?

--

*Hint: `strftime('%w', started_at)` returns `'0'`-`'6'` where `'0'` = Sunday.
Label with `CASE`, and don't sort alphabetically — build a second `CASE` as
a sort key.*

--

.small[
**1. Label the day.** `CASE &lt;expr&gt; WHEN &lt;value&gt; THEN ... END` — no commas
between branches, `%w` starts at Sunday = `'0'`.
```sql
CASE strftime('%w', started_at)
  WHEN '1' THEN 'Mon' WHEN '2' THEN 'Tue' WHEN '3' THEN 'Wed'
  WHEN '4' THEN 'Thu' WHEN '5' THEN 'Fri' WHEN '6' THEN 'Sat'
  WHEN '0' THEN 'Sun'
END AS day_of_week
```
]

--

.small[
**2. Aggregate, grouping on the alias.** `GROUP BY`/`ORDER BY` can
reference a `SELECT` alias (a convenience exception); `WHERE` can't — it
runs before the alias exists.
```sql
COUNT(*) AS total_rides,
ROUND(AVG(fare_usd), 2) AS avg_fare
...
GROUP BY day_of_week
```
]

--

.small[
**3. Sort Mon→Sun, not alphabetically.** A raw `%w` column would put Sunday
(`'0'`) first; a second `CASE` gives an explicit sort key instead.
```sql
ORDER BY CASE day_of_week
  WHEN 'Mon' THEN 1 WHEN 'Tue' THEN 2 WHEN 'Wed' THEN 3
  WHEN 'Thu' THEN 4 WHEN 'Fri' THEN 5 WHEN 'Sat' THEN 6
  WHEN 'Sun' THEN 7
END
```
]

# Q6. Rides and avg fare by day of week, Mon-Sun order? (cont.)

.small[

```sql
SELECT
    CASE strftime('%w', started_at)
        WHEN '1' THEN 'Mon' WHEN '2' THEN 'Tue' WHEN '3' THEN 'Wed'
        WHEN '4' THEN 'Thu' WHEN '5' THEN 'Fri' WHEN '6' THEN 'Sat'
        WHEN '0' THEN 'Sun'
    END AS day_of_week,
    COUNT(*) AS total_rides,
    ROUND(AVG(fare_usd), 2) AS avg_fare
FROM rides r
GROUP BY day_of_week
ORDER BY CASE day_of_week
    WHEN 'Mon' THEN 1 WHEN 'Tue' THEN 2 WHEN 'Wed' THEN 3
    WHEN 'Thu' THEN 4 WHEN 'Fri' THEN 5 WHEN 'Sat' THEN 6
    WHEN 'Sun' THEN 7
END;
```

# Sample Code: Monthly Rides, Drivers, Avg Fare &amp; Surge Rate

```sql
-- SELECT + WHERE + aggregates + GROUP BY + HAVING + ORDER BY + LIMIT
SELECT
  strftime('%Y-%m', started_at)                        AS month,
  COUNT(*)                                             AS n_rides,
  COUNT(DISTINCT driver_id)                            AS n_drivers,
  ROUND(AVG(fare_usd), 2)                             AS avg_fare,
  ROUND(1.0 * SUM(CASE WHEN surge_mult &gt; 1 THEN 1
                        ELSE 0 END) / COUNT(*), 3)    AS pct_surged
FROM   rides
WHERE  date(started_at) BETWEEN '2025-01-01' AND '2025-12-31'
GROUP BY month
HAVING COUNT(*) &gt; 100
ORDER BY month
LIMIT 12;
```
