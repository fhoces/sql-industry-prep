# Six Patterns to Memorize

1. **City-level dashboard** (one row per city, many metrics)
2. **Compare-to-global** (HAVING with a subquery)
3. **Conversion funnel** (CASE WHEN counts at each step)
4. **Per-group ranking** (correlated subquery; window function later)
5. **Cohort retention** (signup-month × activity-month)
6. **Bottom-N within group**

If you can write all six from memory, you're past the bar for any data job interview.

name: write-order

# How to Write SQL (for R Users)

In dplyr you write **top-to-bottom in the order things happen**: data → join → group → summarise → sort.

SQL's written order is **scrambled** — you write the output (`SELECT`) first, even though it runs last. This is confusing.

--

**Trick: write SQL from the middle out.**

| Step | What to write | Where it goes |
|---|---|---|
| 1. | `FROM rides r` | Middle |
| 2. | `JOIN requests req ON ...` | Middle |
| 3. | `GROUP BY c.name` | Below the joins |
| 4. | Now go to the top: `SELECT c.name, COUNT(*)` | Top |
| 5. | `ORDER BY ... LIMIT ...` | Bottom |

--

Start with the data source (FROM), add joins, add GROUP BY. **Only then** go back up and write SELECT — by that point you know what columns are available. Feels weird for a week, then it's automatic.

---

# P1: Build a city-level dashboard with rides, drivers, avg fare, and revenue.

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;
**Step 1.** Start from the `rides` table — that's where fares live.

```sql
FROM rides r
```

--

**Step 2.** We need city names, but `rides` doesn't have them. Chain through 3 joins:

```sql
FROM rides r
JOIN requests req ON r.request_id = req.request_id     -- get pickup neighborhood
JOIN neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id -- get city_id
JOIN cities c ON n.city_id = c.city_id                  -- get city name
```

--

**Step 3.** Now we have all the columns. Group by city, compute the aggregates:

```sql
SELECT c.name AS city,
       COUNT(DISTINCT r.driver_id) AS drivers,  -- unique drivers
       COUNT(*) AS n_rides,                      -- total rides
       ROUND(AVG(r.fare_usd), 2) AS avg_fare,   -- average fare
       ROUND(SUM(r.fare_usd), 0) AS revenue      -- total revenue
...
GROUP BY c.name ORDER BY revenue DESC;
```

# P2: Which cities have an average fare above the global average?

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;
Let's build this step by step.

--

**Step 1.** What's the global average fare? A standalone query:

```sql
SELECT ROUND(AVG(fare_usd), 2) FROM rides;
-- returns a single number, e.g., 12.02
```

--

**Step 2.** Compute the average fare **per city** (same JOIN chain as Pattern 1):

```sql
SELECT c.name AS city, ROUND(AVG(r.fare_usd), 2) AS avg_fare
FROM rides r
JOIN requests req ON r.request_id = req.request_id
JOIN neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
JOIN cities c ON n.city_id = c.city_id
GROUP BY c.name;
```

---
count: false

# P2: Which cities have an average fare above the global average?

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;
**Step 3.** Keep only cities whose avg fare beats the global avg. Paste Step 1's query inside `HAVING`:

```sql
HAVING AVG(r.fare_usd) &gt; (SELECT AVG(fare_usd) FROM rides)
```

The `(SELECT AVG(fare_usd) FROM rides)` is a **scalar subquery** — a mini-query that returns one number, used here like a constant.

Note it says `fare_usd`, not `r.fare_usd`. The subquery is **self-contained** — it has its own `FROM rides` and doesn't know about the outer query's `r` alias. It scans the whole table independently and returns one number.

# P2: Compare to global — full query + result

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;
.pull-left[
.small[
```sql
SELECT c.name AS city,
  ROUND(AVG(r.fare_usd), 2) AS avg_fare,
  (SELECT ROUND(AVG(fare_usd), 2)
   FROM rides) AS global_avg
FROM rides r
JOIN requests req
  ON r.request_id = req.request_id
JOIN neighborhoods n
  ON req.pickup_nbhd_id = n.nbhd_id
JOIN cities c
  ON n.city_id = c.city_id
GROUP BY c.name
HAVING AVG(r.fare_usd) &gt;
  (SELECT AVG(fare_usd) FROM rides)
ORDER BY avg_fare DESC;
```
]

# P3: Build a funnel — how many requests become rides, and how many get 5 stars?

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;

**Step 1.** Start with `requests` and LEFT JOIN `rides` — LEFT because not every request becomes a ride:

```sql
FROM requests req
LEFT JOIN rides r ON req.request_id = r.request_id
```

--

**Step 2.** Count everything (= total requests):

```sql
COUNT(*) AS step1_requests
```

--

**Step 3.** Count only the rows where a ride actually happened. The trick: `CASE WHEN condition THEN 1 ELSE 0 END` inside `SUM()` — this counts rows that meet the condition (like `sum(x == TRUE)` in R):

```sql
SUM(CASE WHEN req.accepted = 1 THEN 1 ELSE 0 END) AS step2_accepted
SUM(CASE WHEN r.ride_id IS NOT NULL THEN 1 ELSE 0 END) AS step3_completed
SUM(CASE WHEN r.rider_rating = 5 THEN 1 ELSE 0 END) AS step4_5star
```

---
count: false

# P3: Funnel — full query + result

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;

.small[

```sql
SELECT
  COUNT(*)                                                AS step1_requests,
  SUM(CASE WHEN req.accepted = 1 THEN 1 ELSE 0 END)       AS step2_accepted,
  SUM(CASE WHEN r.ride_id IS NOT NULL THEN 1 ELSE 0 END)  AS step3_completed,
  SUM(CASE WHEN r.rider_rating = 5 THEN 1 ELSE 0 END)     AS step4_5star,
  ROUND(1.0 * SUM(CASE WHEN r.rider_rating = 5 THEN 1 ELSE 0 END) /
        COUNT(*), 3) AS overall_conv
FROM requests req
LEFT JOIN rides r ON req.request_id = r.request_id;
```




Table: 1 records

| step1_requests| step2_accepted| step3_completed| step4_5star| overall_conv|
|--------------:|--------------:|---------------:|-----------:|------------:|
|          50000|          39000|           39000|       23536|        0.471|
]

Read each column as: "of all the rows, how many passed this filter?" The numbers should decrease at each step — that's the funnel.

**Why `1.0 *`?** Without it, SQLite does integer division: `3 / 10 = 0` (truncated). Multiplying by `1.0` forces float math: `1.0 * 3 / 10 = 0.3`. In R this never comes up because R uses doubles by default.

**Why not `step4_5star / step1_requests`?** You can't reference column aliases within the same SELECT — they don't exist yet (SELECT runs as one step). You have to repeat the full expressions, or use a CTE to compute the columns first and divide in the outer query.

# P4: For each signup-month cohort, how many riders were active in each subsequent month?

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;

A **CTE** lets you name a temporary result. Read `WITH cohort AS (...)` as **"let `cohort` = this query"** — like `cohort &lt;- riders |&gt; ...` in R. (Covered fully in Module 4.)

**Step 1.** CTE for each rider's cohort (signup month):

```sql
WITH cohort AS (
  SELECT rider_id, strftime('%Y-%m', signup_date) AS cohort_month
  FROM riders
)
```

--

**Step 2.** CTE for each rider's activity months (comma-separated from Step 1):

```sql
activity AS (
  SELECT DISTINCT rider_id, strftime('%Y-%m', requested_at) AS activity_month
  FROM requests
)
```

# P4: Cohort retention — Step 3

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;

**Step 3.** Join the two CTEs and count distinct riders per (cohort, month):

```sql
SELECT c.cohort_month, a.activity_month,
       COUNT(DISTINCT c.rider_id) AS active_riders
FROM cohort c JOIN activity a ON c.rider_id = a.rider_id
GROUP BY c.cohort_month, a.activity_month
```

# P4: Cohort retention — full query + result

&lt;a class="write-ref" href="#write-order"&gt;WO&lt;/a&gt;

.small[

```sql
WITH cohort AS (
  SELECT rider_id, strftime('%Y-%m', signup_date) AS cohort_month
  FROM riders
),
activity AS (
  SELECT DISTINCT rider_id, strftime('%Y-%m', requested_at) AS activity_month
  FROM requests
)
SELECT c.cohort_month, a.activity_month,
       COUNT(DISTINCT c.rider_id) AS active_riders
FROM cohort c JOIN activity a ON c.rider_id = a.rider_id
GROUP BY c.cohort_month, a.activity_month
ORDER BY c.cohort_month, a.activity_month
LIMIT 6;
```




Table: 6 records

|cohort_month |activity_month | active_riders|
|:------------|:--------------|-------------:|
|2022-01      |2025-01        |            63|
|2022-01      |2025-02        |            59|
|2022-01      |2025-03        |            57|
|2022-01      |2025-04        |            55|
|2022-01      |2025-05        |            65|
|2022-01      |2025-06        |            56|

Each row = one (cohort, month) pair. To see retention *rates*, divide `active_riders` by the cohort's total size.

# Common Mistakes

**1. Selecting non-aggregated columns without grouping.**

```sql
-- WRONG: which driver_id does it pick? Arbitrary!
SELECT city, driver_id, COUNT(*) AS n_rides
FROM rides GROUP BY city;

-- RIGHT: every non-aggregate column must be in GROUP BY
SELECT city, driver_id, COUNT(*) AS n_rides
FROM rides GROUP BY city, driver_id;
```

Strict SQL (Postgres) errors out. SQLite silently picks an arbitrary `driver_id` per city — which is worse because you get a result that *looks* fine but is wrong.

--

**2. `COUNT` vs `COUNT(DISTINCT)`.** `COUNT(*)` counts rows. `COUNT(DISTINCT col)` counts unique values. Always be deliberate.

--

**3. Counting "users" after a JOIN.** Joins multiply rows. `COUNT(rider_id)` after a join counts *rides*, not riders. Use `COUNT(DISTINCT rider_id)`.

--

**4. Filtering aggregates in `WHERE`.** Doesn't work. Use `HAVING`.

```sql
-- WRONG: aggregates don't exist in WHERE (runs before GROUP BY)
SELECT city, COUNT(*) AS n FROM rides
WHERE COUNT(*) &gt; 1000 GROUP BY city;

-- RIGHT: HAVING runs after GROUP BY, so aggregates exist
SELECT city, COUNT(*) AS n FROM rides
GROUP BY city HAVING COUNT(*) &gt; 1000;
```

# Q1. How does the acceptance rate vary by hour of day?

--

*Hint: no join needed. `accepted` is a 0/1 flag, so its average per group IS
the rate (the same trick as M2's Q4).*

--


```sql
SELECT strftime('%H', requested_at) AS hour,
       COUNT(*)                     AS n_requests,
       ROUND(AVG(accepted), 3)      AS accept_rate
FROM   requests
GROUP BY hour
ORDER BY accept_rate DESC
-- LIMIT is display-only: the full result has 24 rows
LIMIT 5;
```

|05   |       2066|       0.795|
|09   |       2200|       0.789|
|20   |       2046|       0.787|

name: q2-city-funnel

# Q2. Build the request → ride → 5-star funnel, per city.

--

*Hint: P3's funnel is one row for the whole platform. Add the join chain to
`cities` and a `GROUP BY` to break it out. Keep the LEFT JOIN, or unaccepted
requests vanish from step 1 and every rate is wrong.*

--

.small[

```sql
SELECT c.name AS city,
       COUNT(*)                                               AS requests,
       SUM(CASE WHEN r.ride_id IS NOT NULL THEN 1 ELSE 0 END) AS rides,
       SUM(CASE WHEN r.rider_rating = 5 THEN 1 ELSE 0 END)    AS five_star,
       ROUND(1.0 * SUM(CASE WHEN r.rider_rating = 5 THEN 1 ELSE 0 END)
               / COUNT(*), 3)                                 AS req_to_5star
FROM   requests req
LEFT JOIN rides r      ON req.request_id = r.request_id
JOIN   neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
JOIN   cities c        ON n.city_id = c.city_id
GROUP BY c.name
ORDER BY req_to_5star DESC;
```




Table: 5 records

|city          | requests| rides| five_star| req_to_5star|
|:-------------|--------:|-----:|---------:|------------:|
|San Francisco |     9827|  7668|      4666|        0.475|
|Boston        |    10076|  7906|      4761|        0.473|
|Austin        |    10002|  7780|      4726|        0.473|
|Chicago       |    10143|  7946|      4773|        0.471|
|Seattle       |     9952|  7700|      4610|        0.463|
]

name: q3-above-avg

# Q3. Which drivers rate above the average driver in their city?

--

*Hint: two layers. First compute each driver's average rating per city; then
keep the rows beating their own city's average. "Their own" makes the
comparison [correlated (Module 4)](../module-04/slides.html#correlated-subquery).*

--

.small[
**1. Per-driver, per-city averages** — a [CTE (Module 4 material)](../module-04/slides.html#subquery-flavors), used early because naming the layer keeps step 2 readable.
```sql
WITH driver_city_ratings AS (
  SELECT r.driver_id, n.city_id, AVG(r.rider_rating) AS avg_rating
  FROM rides r
  JOIN requests req    ON r.request_id = req.request_id
  JOIN neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
  WHERE r.rider_rating IS NOT NULL
  GROUP BY r.driver_id, n.city_id
)
```
]

--

.small[
**2. Compare each row to its own city's average.** The subquery re-runs per
outer row because it references `dcr.city_id` — that's what "correlated" means.
```sql
WHERE dcr.avg_rating &gt; (SELECT AVG(avg_rating)
                        FROM driver_city_ratings dcr2
                        WHERE dcr2.city_id = dcr.city_id)
```
]

---

# Q3. Which drivers rate above the average driver in their city? (cont.)

.small[

```sql
WITH driver_city_ratings AS (
  SELECT r.driver_id, n.city_id, AVG(r.rider_rating) AS avg_rating
  FROM rides r
  JOIN requests req    ON r.request_id = req.request_id
  JOIN neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
  WHERE r.rider_rating IS NOT NULL
  GROUP BY r.driver_id, n.city_id
)
SELECT dcr.driver_id, dcr.city_id, ROUND(dcr.avg_rating, 2) AS avg_rating
FROM   driver_city_ratings dcr
WHERE  dcr.avg_rating &gt; (SELECT AVG(avg_rating)
                         FROM driver_city_ratings dcr2
                         WHERE dcr2.city_id = dcr.city_id)
ORDER BY dcr.avg_rating DESC
-- LIMIT is display-only: the full result has 2,107 driver-city pairs
LIMIT 4;
```

# The Key Takeaways

&lt;br&gt;

### 1. The six patterns above cover almost every analytical query you'll write.

&lt;br&gt;

### 2. WHERE filters rows; HAVING filters groups. Aggregates can only live in HAVING.

--

&lt;br&gt;

### 3. CASE WHEN inside an aggregate is the SQL idiom for `mean(condition)`. Memorize it.

# Sample Code: Cohort Retention with Accept Rates

.small[Dashboard + compare-to-global + funnel + cohort (all 4 patterns)]

```sql
WITH cohort AS (
  SELECT rider_id, strftime('%Y-%m', signup_date) AS cohort_month FROM riders
),
monthly_activity AS (
  SELECT req.rider_id, strftime('%Y-%m', req.requested_at) AS month,
    SUM(CASE WHEN req.accepted = 1 THEN 1 ELSE 0 END) AS n_accepted,
    COUNT(*) AS n_requests
  FROM requests req GROUP BY req.rider_id, month
)
SELECT c.cohort_month, a.month,
  COUNT(DISTINCT c.rider_id) AS active_riders,
  ROUND(1.0 * SUM(a.n_accepted) / SUM(a.n_requests), 3) AS avg_accept_rate
FROM cohort c JOIN monthly_activity a ON c.rider_id = a.rider_id
GROUP BY c.cohort_month, a.month;
```
