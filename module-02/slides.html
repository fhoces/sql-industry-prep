**Rows in `x` with NO match in `y`.** There's no `ANTI JOIN` keyword: write `LEFT JOIN ... WHERE y.id IS NULL` or `NOT EXISTS`.

# Syntax

```sql
SELECT  r.ride_id, d.gender
FROM    rides AS r
JOIN    drivers AS d
  ON    r.driver_id = d.driver_id
WHERE   ...;
```

The `ON` clause specifies which column links the two tables — the same column you'd put in `by =` in dplyr's `left_join(rides, drivers, by = "driver_id")`.

--

Three things:

1. **Always use table aliases** (`r`, `d`, etc.). Shorter, and disambiguates columns that exist in both tables (like `driver_id`).
2. **`ON` is the join condition** — anything that evaluates TRUE/FALSE works, including non-equality.
3. **`USING (col)`** is shorthand for `ON r.col = d.col` when the column has the same name in both tables.

# Inner JOIN: The Result


```sql
SELECT r.ride_id, r.driver_id, d.gender, r.fare_usd
FROM   rides r
JOIN   drivers d ON r.driver_id = d.driver_id  -- swap to "LEFT JOIN" and rides with no matching driver stay (NULL gender)
LIMIT 5;
```




Table: 5 records

|ride_id | driver_id|gender | fare_usd|
|:-------|---------:|:------|--------:|
|1       |       429|F      |    16.52|
|2       |        83|M      |    19.78|
|3       |       535|M      |    26.97|
|4       |       101|M      |    13.68|
|5       |        85|M      |    16.65|

--

Each ride now has the driver's `gender` attached. The `ON r.driver_id = d.driver_id` told SQL which rows to match — same as `inner_join(rides, drivers, by = "driver_id")` in dplyr.

Only rows where `driver_id` exists in **both** tables are kept.

# LEFT JOIN: Table 2

**rides** — only exists for requests that were actually accepted:


```sql
SELECT request_id, ride_id, fare_usd FROM rides LIMIT 5;
```




Table: 5 records

|request_id | ride_id| fare_usd|
|:----------|-------:|--------:|
|1          |       1|    16.52|
|2          |       2|    19.78|
|3          |       3|    26.97|
|4          |       4|    13.68|
|5          |       5|    16.65|

Rejected requests have **no matching row** in `rides`. A LEFT JOIN keeps them anyway (with NULLs for the missing ride columns).

# LEFT JOIN: The Result


```sql
SELECT req.request_id, req.accepted, r.fare_usd
FROM   requests req
LEFT JOIN rides r ON req.request_id = r.request_id  -- swap to "JOIN" (no LEFT) and rejected requests disappear
LIMIT 5;
```




Table: 5 records

|request_id | accepted| fare_usd|
|:----------|--------:|--------:|
|1          |        1|    16.52|
|2          |        1|    19.78|
|3          |        1|    26.97|
|4          |        1|    13.68|
|5          |        1|    16.65|

--

**All** requests are kept (LEFT side). If a request was not accepted, there's no matching ride → `fare_usd` is **NULL**.

This is the key difference from INNER JOIN: unmatched left-side rows stay in the result (with NULLs for the right side) instead of being dropped.

---

# Anti-Join: "Who has NO match?"

**The question:** which requests never became a ride?

In dplyr: `anti_join(requests, rides, by = "request_id")` (one line, done).

--

SQL has **no `ANTI JOIN` keyword**. You fake it in two steps:

1. **LEFT JOIN**: keep all requests; NULLs where no ride exists
2. **Filter for NULLs**: keep only the unmatched ones


```sql
SELECT req.request_id, req.rider_id, req.requested_at
FROM   requests req
LEFT JOIN rides r ON req.request_id = r.request_id
WHERE  r.ride_id IS NULL
LIMIT 5;
```




Table: 5 records

| request_id| rider_id|requested_at        |
|----------:|--------:|:-------------------|
|          6|     2790|2025-01-20 19:40:00 |
|          7|     2958|2025-06-29 02:40:00 |
|          8|      412|2025-07-01 03:15:00 |
|         15|     3891|2025-05-29 00:40:00 |
|         21|     2739|2025-01-01 07:10:00 |

--

The `WHERE r.ride_id IS NULL` keeps only requests whose LEFT JOIN produced no match, i.e. requests no driver accepted. That's the anti-join.

# Self-Join: "Compare to another row of the same table"

**Q:** For each ride, what was the driver's *previous* ride?
**A:** Join `rides` against itself, with a time inequality, then keep the most-recent earlier match.

&lt;pre style="background:#f5f5f5;padding:0.6em 0.9em;border-radius:4px;font-family:'Source Code Pro',Menlo,monospace;font-size:85%;line-height:1.4;margin:0;"&gt;
&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③ SELECT&lt;/b&gt; r1.ride_id, r1.driver_id, r1.started_at,
         &lt;b&gt;MAX&lt;/b&gt;(r2.started_at) &lt;b&gt;AS&lt;/b&gt; previous_ride&lt;/span&gt;
&lt;span style="color:#1f78b4;"&gt;&lt;b&gt;① FROM&lt;/b&gt;   rides r1
    &lt;b&gt;LEFT JOIN&lt;/b&gt; rides r2 &lt;b&gt;ON&lt;/b&gt; r1.driver_id  = r2.driver_id
                    &lt;b&gt;AND&lt;/b&gt; r2.started_at &amp;lt; r1.started_at&lt;/span&gt;
&lt;span style="color:#33a02c;"&gt;&lt;b&gt;② GROUP BY&lt;/b&gt; r1.ride_id&lt;/span&gt;
&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④ LIMIT&lt;/b&gt; 5;&lt;/span&gt;
&lt;/pre&gt;

.small[

Table: 5 records

|ride_id | driver_id|started_at                 |previous_ride              |
|:-------|---------:|:--------------------------|:--------------------------|
|1       |       429|2025-08-19 11:47:40.051507 |2025-07-11 12:55:42.188794 |
|2       |        83|2025-08-19 03:49:02.160463 |2025-08-17 00:32:54.489205 |
|3       |       535|2025-01-04 06:25:37.120311 |2025-01-01 02:55:31.354864 |
|4       |       101|2025-08-05 08:03:57.718588 |2025-07-25 12:12:44.473374 |
|5       |        85|2025-06-13 13:28:00.10871  |2025-06-13 01:54:43.014878 |
]

# Self-Join: reading the aliases

`r1` and `r2` are **two copies of the same table**, joined together. Treat them as two separate tables that just happen to share rows.

| Alias | Role |
|---|---|
| `r1` | the **anchor** ride — the row we're computing "previous" for |
| `r2` | a **candidate** previous ride — any earlier ride by the same driver |

The two `ON` conditions narrow `r2` to *eligible* matches:

1. `r1.driver_id = r2.driver_id` — same driver
2. `r2.started_at &lt; r1.started_at` — earlier in time

Then `MAX(r2.started_at)` after `GROUP BY r1.ride_id` picks the **most recent** of those earlier rides — the immediate predecessor. A driver's *first* ride has no eligible `r2`, so `previous_ride` is `NULL` (LEFT JOIN preserves it).

**Window-function alternative** (Module 5): `LAG(started_at) OVER (PARTITION BY driver_id ORDER BY started_at)` does the same thing in one expression — cheaper and clearer. Self-join is the *pre*-window-function pattern; it still shows up in interviews because not every dialect/version has window functions.

# Pattern: Multi-table chain

**Q:** I need a column that lives several joins away. How do I get it?
**A:** Chain joins one hop at a time. Numerals = hop order.

&lt;pre style="background:#f5f5f5;padding:0.6em 0.9em;border-radius:4px;font-family:'Source Code Pro',Menlo,monospace;font-size:90%;line-height:1.4;margin:0;"&gt;
&lt;span style="color:#ff7f00;"&gt;&lt;b&gt;③ SELECT&lt;/b&gt; c.name &lt;b&gt;AS&lt;/b&gt; city,
         &lt;b&gt;COUNT&lt;/b&gt;(*) &lt;b&gt;AS&lt;/b&gt; n_rides,
         &lt;b&gt;ROUND&lt;/b&gt;(&lt;b&gt;AVG&lt;/b&gt;(r.fare_usd), 2) &lt;b&gt;AS&lt;/b&gt; avg_fare&lt;/span&gt;
&lt;span style="color:#1f78b4;"&gt;&lt;b&gt;① FROM&lt;/b&gt;   rides r
    &lt;b&gt;JOIN&lt;/b&gt;   requests      req &lt;b&gt;ON&lt;/b&gt; r.request_id       = req.request_id
    &lt;b&gt;JOIN&lt;/b&gt;   neighborhoods n   &lt;b&gt;ON&lt;/b&gt; req.pickup_nbhd_id = n.nbhd_id
    &lt;b&gt;JOIN&lt;/b&gt;   cities        c   &lt;b&gt;ON&lt;/b&gt; n.city_id          = c.city_id&lt;/span&gt;
&lt;span style="color:#33a02c;"&gt;&lt;b&gt;② GROUP BY&lt;/b&gt; c.name&lt;/span&gt;
&lt;span style="color:#e31a1c;"&gt;&lt;b&gt;④ ORDER BY&lt;/b&gt; n_rides &lt;b&gt;DESC&lt;/b&gt;;&lt;/span&gt;
&lt;/pre&gt;

.small[

Table: 5 records

|city          | n_rides| avg_fare|
|:-------------|-------:|--------:|
|Chicago       |    7946|    12.03|
|Boston        |    7906|    12.04|
|Austin        |    7780|    12.03|
|Seattle       |    7700|    11.94|
|San Francisco |    7668|    12.02|
]

# Pattern: Multi-table chain — reading the aliases

The single-letter aliases are shorthand for table names:

| Alias | Table | What it contributes |
|---|---|---|
| `r` | `rides` | fare, distance, timing |
| `req` | `requests` | links rides to pickup neighborhood |
| `n` | `neighborhoods` | links neighborhood to city |
| `c` | `cities` | the city name we want |

So `c.name` = "the `name` column from the `cities` table" — like `cities$name` in R.

&lt;details&gt;&lt;summary&gt;Click here to see the same query in R / dplyr&lt;/summary&gt;
&lt;pre&gt;
rides |&gt;
  left_join(requests, by = "request_id") |&gt;
  left_join(neighborhoods, by = c("pickup_nbhd_id" = "nbhd_id")) |&gt;
  left_join(cities, by = "city_id") |&gt;
  group_by(city = name) |&gt;
  summarise(n_rides = n(), avg_fare = round(mean(fare_usd), 2)) |&gt;
  arrange(desc(n_rides))
&lt;/pre&gt;
&lt;/details&gt;

# Common Mistakes

**1. Cartesian explosion.** Forget the `ON` clause and you get every row in A paired with every row in B. With 39k rides × 800 drivers = 31M rows. **Always check the join before running.**

--

**2. Inner join silently dropping rows.** If 5% of rides have a `driver_id` that doesn't exist in `drivers`, an inner join drops them silently. The honest pattern is LEFT JOIN + check for NULLs.

--

**3. Aggregating after a join.** Joining can multiply rows. Always check: one-to-one, one-to-many, or many-to-many?

--

**4. Filtering on the right side of a LEFT JOIN.** Putting `WHERE r.fare_usd &gt; 20` after a `LEFT JOIN rides r` silently turns it into an INNER JOIN — because it filters out the NULL rows. Put the filter in `ON` instead.

# Q1. For each rider, how many unique drivers have they ridden with?

--

&lt;a class="write-ref" href="../module-03/slides.html#write-order"&gt;WO&lt;/a&gt;
*Hint: JOIN `rides` to `requests` (to get `rider_id`), then `COUNT(DISTINCT driver_id)`.*

--

.small[

```sql
SELECT req.rider_id,
       COUNT(DISTINCT r.driver_id) AS n_unique_drivers,
       COUNT(*)                    AS n_rides
FROM   rides r
JOIN   requests req ON r.request_id = req.request_id
GROUP BY req.rider_id
ORDER BY n_unique_drivers DESC
-- LIMIT is display-only
LIMIT 3;
```




Table: 3 records

| rider_id| n_unique_drivers| n_rides|
|--------:|----------------:|-------:|
|     2340|               23|      23|
|     1163|               21|      21|
|      854|               21|      21|
]

.small[
**What does this inner join drop?** The 11,000 unaccepted requests (50,000 requests, 39,000 rides): they have no row in `rides`, so they never enter the result. That's correct here, since "ridden with" is about rides that happened. The only assumption the join makes is that every *ride* has a request, true by construction. When the unaccepted requests are the ones you care about, flip the base table: `FROM requests LEFT JOIN rides` (Q4).
]

# Q2. For each ride, how many days had the driver been on the platform?

--

&lt;a class="write-ref" href="../module-03/slides.html#write-order"&gt;WO&lt;/a&gt;
*Hint: JOIN `rides` to `drivers`, then `julianday(started_at) - julianday(signup_date)`.*

.small[

```sql
SELECT r.ride_id, r.driver_id,
       ROUND(julianday(r.started_at) - julianday(d.signup_date)) AS tenure_days
FROM rides r JOIN drivers d ON r.driver_id = d.driver_id
LIMIT 5;

# Q3. Which rider-driver pairs have had 2 or more 5-star rides together?

--

&lt;a class="write-ref" href="../module-03/slides.html#write-order"&gt;WO&lt;/a&gt;
*Hint: JOIN `rides` to `requests`, filter for `rider_rating = 5`, GROUP BY the pair, HAVING &gt;= 2.*

--


```sql
SELECT req.rider_id, r.driver_id, COUNT(*) AS n_5star
FROM   rides r
JOIN   requests req ON r.request_id = req.request_id
WHERE  r.rider_rating = 5
GROUP BY req.rider_id, r.driver_id
HAVING COUNT(*) &gt;= 2
ORDER BY n_5star DESC
LIMIT 5;
```




Table: 5 records

| rider_id| driver_id| n_5star|
|--------:|---------:|-------:|
|       20|       768|       2|
|       73|       134|       2|
|      111|        63|       2|
|      171|       147|       2|
|      197|       223|       2|

.small[
**Why `HAVING COUNT(*) &gt;= 2` instead of `HAVING n_5star &gt;= 2`?** Because `n_5star` is a column alias defined in SELECT, and HAVING runs *before* SELECT. You have to repeat the expression. (SQLite/MySQL are lenient about this; PostgreSQL is not — use the safe version.)
]

# Q4. What share of requests go unaccepted, in each city?

--

*Hint: start `FROM requests`, not `FROM rides` — the unaccepted requests are
exactly the ones with no ride, so starting from `rides` would drop the rows
you're studying. Then LEFT JOIN and count the NULLs.*

--

.small[
**1. Direction of the LEFT JOIN.** `requests` is the left (keep-everything)
side; a request with no matching ride comes back with `r.ride_id` as NULL —
and those NULLs *are* the unaccepted requests.
```sql
FROM requests req
LEFT JOIN rides r ON req.request_id = r.request_id
```
]

--

.small[
**2. Chain up to `cities`.** These two can stay INNER — every request has a
pickup neighborhood, so nothing gets dropped.
```sql
JOIN neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
JOIN cities c        ON n.city_id = c.city_id
```
]

--

.small[
**3. Count the NULLs per city.** `CASE WHEN ... IS NULL` inside `SUM()`, and
`1.0 *` to dodge integer division (Module 1's Q2 trick).
```sql
SUM(CASE WHEN r.ride_id IS NULL THEN 1 ELSE 0 END) AS n_unaccepted
```
]

# Q4. What share of requests go unaccepted, in each city? (cont.)

.small[

```sql
SELECT c.name AS city,
       COUNT(*) AS n_requests,
       SUM(CASE WHEN r.ride_id IS NULL THEN 1 ELSE 0 END) AS n_unaccepted,
       ROUND(1.0 * SUM(CASE WHEN r.ride_id IS NULL THEN 1 ELSE 0 END)
               / COUNT(*), 3) AS pct_unaccepted
FROM   requests req
LEFT JOIN rides r      ON req.request_id = r.request_id
JOIN   neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
JOIN   cities c        ON n.city_id = c.city_id
GROUP BY c.name
ORDER BY pct_unaccepted DESC;
```

|city          | n_requests| n_unaccepted| pct_unaccepted|

|Seattle       |       9952|         2252|          0.226|
|Austin        |      10002|         2222|          0.222|
|San Francisco |       9827|         2159|          0.220|
|Chicago       |      10143|         2197|          0.217|
|Boston        |      10076|         2170|          0.215|

**Sanity check:** `requests` also carries an `accepted` flag, and
`SUM(1 - accepted)` gives the same 11,000 total. The join-based version is
the one to know — most schemas don't hand you the flag.

name: q5-never-minority

# Q5. Which drivers have *never* picked up from a majority-minority neighborhood?

--

*Hint: "never did X" is an anti-join. Build the set of drivers who* did
*(pct_minority ≥ 0.8), then keep the drivers outside it.*

--

.small[
**1. Build the "drivers who HAVE" set.** A subquery chaining
`rides → requests → neighborhoods`; `DISTINCT` because one driver shows up
once per qualifying ride.
```sql
SELECT DISTINCT r.driver_id
FROM   rides r
JOIN   requests req    ON r.request_id = req.request_id
JOIN   neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
WHERE  n.pct_minority &gt;= 0.8
```
]

--

.small[
**2. Anti-join `drivers` against it.** LEFT JOIN keeps every driver; the ones
with no match come back NULL — and those are the "never" drivers.
```sql
FROM drivers d
LEFT JOIN ( ...subquery... ) hm ON d.driver_id = hm.driver_id
WHERE hm.driver_id IS NULL
```
Same result via `NOT IN (subquery)` — that's the form on the sample-code
slide — or `NOT EXISTS`. All three are interview-acceptable.
]

# Q5. Which drivers have *never* picked up from a majority-minority neighborhood? (cont.)

.small[

```sql
SELECT d.driver_id, d.gender, d.signup_date
FROM   drivers d
LEFT JOIN (
  SELECT DISTINCT r.driver_id
  FROM   rides r
  JOIN   requests req    ON r.request_id = req.request_id
  JOIN   neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id
  WHERE  n.pct_minority &gt;= 0.8
) hm ON d.driver_id = hm.driver_id
WHERE  hm.driver_id IS NULL
ORDER BY d.driver_id
-- LIMIT is display-only: the full result has 83 of the 800 drivers
LIMIT 5;
```

name: q6-prev-ride-gap

# Q6. For each ride, how many hours since the driver's previous ride ended?

--

*Hint: this extends the [self-join slide](#self-join) — same
`r1`/`r2` aliases, same time inequality in `ON`, plus a `julianday()`
difference at the end.*

--

.small[
**1. Self-join with an inequality.** `r2` ranges over the *earlier* rides by
the same driver. LEFT JOIN, so each driver's first ride survives (with NULL).
```sql
FROM rides r1
LEFT JOIN rides r2
  ON  r1.driver_id  = r2.driver_id
  AND r2.started_at &lt; r1.started_at
```
]

--

.small[
**2. Keep only the most recent earlier ride.** Each `r1` row matched *all*
earlier rides; `GROUP BY r1.ride_id` + `MAX(r2.ended_at)` collapses that to
the latest one.
```sql
GROUP BY r1.ride_id
... MAX(r2.ended_at) AS prev_ride_ended
```
]

--

.small[
**3. Convert to hours.** `julianday()` returns fractional days, so the
difference `* 24` is hours.
```sql
ROUND((julianday(r1.started_at) - julianday(MAX(r2.ended_at))) * 24, 1)
```
]

---
count: false

# Q6. For each ride, how many hours since the driver's previous ride ended? (cont.)

.small[

```sql
SELECT r1.ride_id, r1.driver_id, r1.started_at,
       MAX(r2.ended_at) AS prev_ride_ended,
       ROUND((julianday(r1.started_at) - julianday(MAX(r2.ended_at))) * 24, 1)
         AS hours_since_prev
FROM   rides r1
LEFT JOIN rides r2
  ON   r1.driver_id  = r2.driver_id
  AND  r2.started_at &lt; r1.started_at
GROUP BY r1.ride_id
LIMIT 5;
```

# The Key Takeaways

&lt;br&gt;

### 1. INNER, LEFT, anti-join — you'll use these three constantly. RIGHT and FULL OUTER, almost never.

--

&lt;br&gt;

### 2. The most common bug: filtering the right side of a LEFT JOIN in WHERE. Always put it in ON.

--

&lt;br&gt;

### 3. Build multi-table joins one step at a time. Don't try to write 5-table joins from scratch.

name: sample
# Sample Code: Rides &amp; Riders Per City/Gender

```sql
-- INNER JOIN + LEFT JOIN + anti-join + multi-table chain
SELECT c.name AS city, d.gender,
       COUNT(*)                    AS n_rides,
       COUNT(DISTINCT req.rider_id) AS n_riders
FROM   rides r
JOIN   drivers d    ON r.driver_id = d.driver_id          -- inner
JOIN   requests req ON r.request_id = req.request_id      -- inner
JOIN   neighborhoods n ON req.pickup_nbhd_id = n.nbhd_id  -- chain
JOIN   cities c     ON n.city_id = c.city_id               -- chain
WHERE  d.driver_id NOT IN (                                -- anti-join
         SELECT driver_id FROM rides
         WHERE  fare_usd &lt; 5)
GROUP BY c.name, d.gender
ORDER BY c.name, n_rides DESC;
```
